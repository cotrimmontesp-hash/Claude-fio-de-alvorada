name: APK pelo EAS (Expo)

# Para usar: crie um token em expo.dev (Account settings > Access tokens)
# e salve no GitHub em Settings > Secrets > Actions com o nome EXPO_TOKEN.
on:
  workflow_dispatch: {}

jobs:
  eas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - run: eas build -p android --profile preview --non-interactive --no-wait
