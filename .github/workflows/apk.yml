name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm install
      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install --clean
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fio-de-alvorada-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publicar APK na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fio de Alvorada — APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
